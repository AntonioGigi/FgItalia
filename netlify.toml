[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Funzioni server del negozio (pagamenti, ordini, avvisi) in netlify/functions
[functions]
  node_bundler = "esbuild"

# I reindirizzamenti dai vecchi indirizzi WordPress sono in public/_redirects

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
