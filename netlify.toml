[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vecchi indirizzi del sito WordPress → nuove pagine (mantiene i link e Google)
[[redirects]]
  from = "/apparecchiature-elettromedicali/*"
  to = "/prodotti/"
  status = 301

[[redirects]]
  from = "/cookie-policy/"
  to = "/privacy/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
