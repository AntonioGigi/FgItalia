# Pubblica il sito su Cloudflare a ogni modifica del ramo main (anche i salvataggi del pannello /admin/).
# Ogni notte ripubblica solo se quel giorno una promozione inizia o finisce o un corso è appena passato.
# Servono i segreti del repository CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (vedi README → "Messa online").
name: Pubblica su Cloudflare

on:
  push:
    branches: [main]
  schedule:
    # 23:05 UTC = 00:05 in Italia d'inverno, 01:05 d'estate
    - cron: '5 23 * * *'
  workflow_dispatch:

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # controllo dei tipi, test automatici e generazione del sito
      - run: npm run build

      - name: Serve ripubblicare stanotte?
        id: controllo
        run: |
          oggi=$(TZ=Europe/Rome date +%F)
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare non ancora collegato: aggiungi i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (README → Messa online)."
            echo "pubblica=no" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ] || grep -q "\"$oggi\"" dist/api/cambi-programmati.json; then
            echo "pubblica=si" >> "$GITHUB_OUTPUT"
          else
            echo "Nessuna promozione o corso cambia oggi ($oggi): niente da pubblicare."
            echo "pubblica=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Archivio dati (creato solo la prima volta)
        if: steps.controllo.outputs.pubblica == 'si'
        run: npx wrangler r2 bucket create fgitalia-dati || echo "Archivio già presente"

      - name: Pubblica
        if: steps.controllo.outputs.pubblica == 'si'
        run: npx wrangler deploy
