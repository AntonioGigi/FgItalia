# Pannello di gestione del sito (Decap CMS) — si apre su https://www.fgitalia.it/admin/
# Ogni salvataggio crea una modifica nel repository GitHub e il sito si aggiorna da solo in 1-2 minuti.
backend:
  name: github
  repo: AntonioGigi/FgItalia
  branch: main
  commit_messages:
    create: 'Pannello: aggiunto {{collection}} “{{slug}}”'
    update: 'Pannello: modificato {{collection}} “{{slug}}”'
    delete: 'Pannello: eliminato {{collection}} “{{slug}}”'
    uploadMedia: 'Pannello: caricato “{{path}}”'
    deleteMedia: 'Pannello: eliminato “{{path}}”'

locale: it
site_url: https://www.fgitalia.it
display_url: https://www.fgitalia.it
logo_url: /favicon.svg
media_folder: public/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: prodotti
    label: Prodotti
    label_singular: Prodotto
    description: Il catalogo. Aggiungi foto, specifiche tecniche e scheda PDF. Togli la spunta "Pubblicato" per nascondere un prodotto senza cancellarlo.
    folder: src/content/prodotti
    create: true
    extension: md
    slug: '{{titolo}}'
    summary: '{{titolo}}{{codice | prefix(" · ")}}'
    sortable_fields: [titolo, categoria, marca]
    view_groups:
      - label: Categoria
        field: categoria
    fields:
      - { label: Nome del prodotto, name: titolo, widget: string }
      - label: Categoria
        name: categoria
        widget: relation
        collection: categorie
        value_field: '{{slug}}'
        search_fields: [titolo]
        display_fields: [titolo]
      - label: Sottocategoria
        name: sottocategoria
        widget: string
        required: false
        hint: 'Es. Laserterapia, Tecarterapia, Creme conduttrici, IASTM. I prodotti con la stessa sottocategoria vengono raggruppati.'
      - label: Marca
        name: marca
        widget: relation
        collection: marchi
        value_field: '{{slug}}'
        search_fields: [nome]
        display_fields: [nome]
        required: false
      - { label: Codice articolo, name: codice, widget: string, required: false }
      - label: Prezzo (€, IVA esclusa)
        name: prezzo
        widget: number
        value_type: float
        step: 0.01
        min: 0
        required: false
        hint: 'Lascia vuoto per mostrare "Prezzo su richiesta".'
      - label: Descrizione breve
        name: descrizione_breve
        widget: text
        hint: Due o tre frasi. Compare nel catalogo e nelle anteprime su WhatsApp/Facebook.
      - label: Disponibilità
        name: disponibilita
        widget: select
        default: disponibile
        options:
          - { label: Disponibile, value: disponibile }
          - { label: Su ordinazione, value: su_ordinazione }
          - { label: Esaurito (non ordinabile), value: esaurito }
      - label: Foto
        name: immagini
        widget: list
        hint: La prima foto è quella principale. Meglio foto su sfondo bianco.
        field: { label: Foto, name: foto, widget: image }
        required: false
      - label: Specifiche tecniche
        name: specifiche
        widget: list
        summary: '{{fields.nome}}: {{fields.valore}}'
        required: false
        fields:
          - { label: Voce, name: nome, widget: string, hint: 'Es. Alimentazione' }
          - { label: Valore, name: valore, widget: string, hint: 'Es. 230 V – 50 Hz' }
      - { label: Scheda tecnica (PDF), name: scheda_pdf, widget: file, required: false }
      - label: Manuali, certificati CE e altri documenti
        name: documenti
        widget: list
        required: false
        summary: '{{fields.titolo}}'
        hint: I clienti che hanno acquistato il prodotto li ritrovano nella loro area clienti.
        fields:
          - { label: Titolo, name: titolo, widget: string, hint: 'Es. Manuale d’uso, Certificato CE, Dichiarazione di conformità' }
          - label: Tipo
            name: tipo
            widget: select
            default: manuale
            options:
              - { label: Manuale d’uso, value: manuale }
              - { label: Certificato CE, value: certificato_ce }
              - { label: Dichiarazione di conformità, value: dichiarazione }
              - { label: Scheda tecnica o di sicurezza, value: scheda }
              - { label: Altro, value: altro }
          - { label: File (PDF), name: file, widget: file }
      - label: Materiale di consumo (riordino rapido)
        name: consumabile
        widget: boolean
        required: false
        hint: Se acceso, il prodotto compare nel "Riordino rapido" dell'area clienti. Per la categoria "Materiali di consumo" vale già in automatico.
      - label: Manutenzione ogni (mesi)
        name: manutenzione_mesi
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Per le apparecchiature. Il cliente riceve un promemoria prima della scadenza. Vuoto = 12 mesi per le apparecchiature; 0 = nessuna manutenzione.
      - { label: In evidenza nella home, name: in_evidenza, widget: boolean, default: false }
      - { label: Pubblicato, name: pubblicato, widget: boolean, default: true }
      - { label: Descrizione completa, name: body, widget: markdown, required: false }

  - name: novita
    label: Novità e offerte
    label_singular: Novità
    description: Notizie, offerte e nuovi arrivi. Ogni novità ha la sua pagina da condividere sui social.
    folder: src/content/novita
    create: true
    extension: md
    slug: '{{year}}-{{month}}-{{day}}-{{titolo}}'
    summary: '{{titolo}} ({{data | date("DD/MM/YYYY")}})'
    sortable_fields: [data, titolo]
    fields:
      - { label: Titolo, name: titolo, widget: string }
      - { label: Data, name: data, widget: datetime, time_format: false, date_format: DD/MM/YYYY, format: YYYY-MM-DD }
      - { label: Immagine, name: immagine, widget: image, required: false }
      - { label: Riassunto, name: riassunto, widget: text }
      - { label: Pubblicato, name: pubblicato, widget: boolean, default: true }
      - { label: Testo, name: body, widget: markdown }

  - name: corsi
    label: Corsi
    label_singular: Corso
    description: I corsi con data futura compaiono come "Prossimi corsi" e nel modulo di iscrizione; quelli passati finiscono da soli tra i "Corsi già svolti".
    folder: src/content/corsi
    create: true
    extension: md
    slug: '{{year}}-{{month}}-{{day}}-{{titolo}}'
    summary: '{{titolo}} ({{data | date("DD/MM/YYYY")}})'
    sortable_fields: [data, titolo]
    fields:
      - { label: Titolo, name: titolo, widget: string }
      - { label: Data, name: data, widget: datetime, time_format: false, date_format: DD/MM/YYYY, format: YYYY-MM-DD }
      - { label: Orario, name: orario, widget: string, required: false, hint: 'Es. 9:00–17:00' }
      - { label: Luogo, name: luogo, widget: string, required: false }
      - { label: Docente, name: docente, widget: string, required: false }
      - { label: Quota (€), name: prezzo, widget: number, value_type: float, step: 0.01, min: 0, required: false }
      - { label: Immagine, name: immagine, widget: image, required: false }
      - { label: Riassunto, name: riassunto, widget: text }
      - label: Avvisa gli iscritti via email
        name: avvisa_iscritti
        widget: boolean
        default: true
        hint: 'Quando il corso viene pubblicato, parte in automatico un’email a tutti gli iscritti agli avvisi.'
      - { label: Pubblicato, name: pubblicato, widget: boolean, default: true }
      - { label: Programma, name: body, widget: markdown }

  - name: categorie
    label: Categorie
    label_singular: Categoria
    folder: src/content/categorie
    create: true
    extension: json
    format: json
    slug: '{{titolo}}'
    summary: '{{titolo}}'
    fields:
      - { label: Nome, name: titolo, widget: string }
      - { label: Descrizione, name: descrizione, widget: text }
      - label: Icona
        name: icona
        widget: select
        options:
          - { label: Fulmine (apparecchiature), value: fisioterapia }
          - { label: Scatola (consumabili), value: consumabili }
          - { label: Mano (terapia manuale), value: strumenti }
          - { label: Manubrio (palestra), value: palestra }
          - { label: Persona in movimento, value: riabilitazione }
          - { label: Monitor parametri vitali, value: monitor }
          - { label: Stetoscopio (diagnostica), value: diagnostica }
          - { label: Valigetta medica, value: medicale }
      - { label: Ordine di visualizzazione, name: ordine, widget: number, value_type: int, default: 99 }

  - name: marchi
    label: Marchi
    label_singular: Marchio
    folder: src/content/marchi
    create: true
    extension: json
    format: json
    slug: '{{nome}}'
    summary: '{{nome}}'
    fields:
      - { label: Nome, name: nome, widget: string }
      - { label: Logo, name: logo, widget: image, required: false }
      - { label: Sito del produttore, name: sito, widget: string, required: false }

  - name: impostazioni
    label: Impostazioni del sito
    editor:
      preview: false
    files:
      - name: generali
        label: Dati aziendali, contatti e social
        file: src/data/impostazioni.json
        fields:
          - { label: Ragione sociale, name: ragione_sociale, widget: string }
          - { label: Nome breve, name: nome_breve, widget: string }
          - { label: Slogan, name: slogan, widget: string }
          - { label: Logo (facoltativo), name: logo, widget: image, required: false, hint: 'Se vuoto viene usato il logo grafico del sito.' }
          - { label: Anno di fondazione, name: anno_fondazione, widget: number, value_type: int }
          - { label: Indirizzo, name: indirizzo, widget: string }
          - { label: CAP, name: cap, widget: string }
          - { label: Città, name: citta, widget: string }
          - { label: Provincia, name: provincia, widget: string }
          - { label: Partita IVA, name: piva, widget: string }
          - { label: Telefono, name: telefono, widget: string, required: false }
          - { label: Numero WhatsApp, name: whatsapp, widget: string, required: false, hint: 'Es. 333 1234567. Attiva il pulsante verde WhatsApp su tutto il sito.' }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Orari, name: orari, widget: string, required: false, hint: 'Es. Lun–Ven 9:00–13:00 / 15:30–19:00' }
          - { label: Instagram, name: instagram, widget: string, required: false, hint: 'Nome utente (es. fgitalia) o link al profilo' }
          - { label: Facebook, name: facebook, widget: string, required: false, hint: 'Link alla pagina Facebook' }
          - { label: Negozio online attivo, name: negozio_attivo, widget: boolean, hint: 'Se disattivato, i prodotti si possono solo ordinare su WhatsApp o con il modulo.' }
          - { label: Costo spedizione (€, IVA inclusa), name: spedizione_costo, widget: number, value_type: float, step: 0.01, min: 0 }
          - { label: Spedizione gratuita per ordini da (€, IVA esclusa), name: spedizione_gratis_da, widget: number, value_type: float, step: 1, min: 0, hint: '0 = spedizione mai gratuita' }
          - { label: Titolo principale della home, name: hero_titolo, widget: string }
          - { label: Testo della home, name: hero_testo, widget: text }
