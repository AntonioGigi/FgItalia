<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Prodotti e contenuti | FGItalia</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <link rel="preload" href="/admin/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/admin/tema.css" />
  </head>
  <body>
    <!-- stessa barra di /gestione-ordini/ (src/components/BarraPannello.astro): tenerle uguali -->
    <header class="barra-pannello">
      <a class="barra-pannello__logo" href="/" title="Vai al sito">
        <img src="/uploads/logo-fgitalia.png" alt="" width="60" height="40" />
        <span>FGItalia <small>Pannello</small></span>
      </a>
      <nav aria-label="Sezioni del pannello">
        <a href="/admin/" aria-current="page"><span aria-hidden="true">✏️</span> Prodotti e contenuti</a>
        <a href="/gestione-ordini/#ordini"><span aria-hidden="true">📦</span> Ordini</a>
        <a href="/gestione-ordini/#preventivi"><span aria-hidden="true">📄</span> Preventivi</a>
        <a href="/gestione-ordini/#assistenza"><span aria-hidden="true">🛠️</span> Assistenza</a>
        <a href="/gestione-ordini/#messaggi"><span aria-hidden="true">💬</span> Messaggi</a>
        <a href="https://webmail.aruba.it/" target="_blank" rel="noopener" title="Apri la casella email (webmail Aruba)"
          ><span aria-hidden="true">📧</span> Posta</a
        >
      </nav>
    </header>
    <div id="nc-root"></div>
    <script>
      // Accesso con la password del pannello ordini (pagina /cms-accesso/) invece dell'account GitHub
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script>
      // l'anteprima dei prodotti usa gli stessi colori e caratteri del sito
      CMS.registerPreviewStyle('/admin/tema-anteprima.css');
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'AntonioGigi/FgItalia',
            branch: 'main',
            base_url: window.location.origin,
            auth_endpoint: 'cms-accesso/',
          },
        },
      });
    </script>
  </body>
</html>
